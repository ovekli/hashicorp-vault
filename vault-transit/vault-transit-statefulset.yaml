piVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    meta.helm.sh/release-name: vault-transit
    meta.helm.sh/release-namespace: vault-transit
  creationTimestamp: "2026-08-01T18:51:07Z"
  generation: 21
  labels:
    app.kubernetes.io/instance: vault-transit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vault
  name: vault-transit
  namespace: vault-transit
  resourceVersion: "50853"
  uid: 663da48e-5d4d-4f2a-9580-be328bb96f60
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: vault-transit
      app.kubernetes.io/name: vault
      component: server
  serviceName: vault-transit-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: vault-transit
        app.kubernetes.io/name: vault
        component: server
        helm.sh/chart: vault-0.34.0
    spec:
      containers:
      - args:
        - 'vault server -config /home/vault/config/config.hcl & 
           if [ -d /var/lib/vault/data ]; then 
            vault operator unseal unseal-key1; 
            vault operator unseal unseal-key2;
            vault operator unseal unseal-key3;
           fi;   
           while(true); do 
            sleep 3600; 
           done'
        command:
        - /bin/sh
        - -ec
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: VAULT_K8S_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: VAULT_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        - name: VAULT_API_ADDR
          value: http://$(POD_IP):8200
        - name: SKIP_CHOWN
          value: "true"
        - name: SKIP_SETCAP
          value: "true"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: VAULT_CLUSTER_ADDR
          value: https://$(HOSTNAME).vault-transit-internal:8201
        - name: HOME
          value: /home/vault
        - name: VAULT_DEV_LISTEN_ADDRESS
          value: '[::]:8200'
        image: docker.io/hashicorp/vault:2.0.3
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5 && kill -SIGTERM $(pidof vault)
        name: vault
        ports:
        - containerPort: 8200
          name: http
          protocol: TCP
        - containerPort: 8201
          name: https-internal
          protocol: TCP
        - containerPort: 8202
          name: http-rep
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - vault status -tls-skip-verify
          failureThreshold: 2
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/vault
          name: home
        - mountPath: /var/lib/vault
          name: vault-transit
        - mountPath: /home/vault/config
          name: vault-transit-cm
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: vault-transit
      serviceAccountName: vault-transit
      terminationGracePeriodSeconds: 10
      volumes:
      - emptyDir: {}
        name: home
      - name: vault-transit
        persistentVolumeClaim:
          claimName: vault-transit
      - configMap:
          defaultMode: 420
          name: vault-transit
        name: vault-transit-cm
  updateStrategy:
    type: OnDelete